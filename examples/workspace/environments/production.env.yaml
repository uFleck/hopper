hopper: 2
kind: environment
applications:
  httpbin:
    variables:
      httpbin: https://httpbin.org
    secrets:
      demoToken:
        provider: keyring
    allowedHosts:
    - httpbin.org
  jsonplaceholder:
    variables:
      jsonplaceholder: https://jsonplaceholder.typicode.com
    allowedHosts:
    - jsonplaceholder.typicode.com
