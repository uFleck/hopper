[package]
name = "hopper-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1"
sha2 = "0.11"
thiserror = "2"
ulid = "3"
uuid = { version = "1", features = ["v4"] }
secrecy = "0.10.3"
async-trait = "0.1.92"
zeroize = "1.9.1"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "zstd", "cookies", "multipart", "stream", "system-proxy"] }
notify = "8"
nucleo-matcher = "0.3"
keyring = { version = "3", features = ["windows-native"] }
cookie_store = "0.22"

[dev-dependencies]
axum = "0.8"
rcgen = "0.14"
tempfile = "3"
tokio-rustls = "0.26"
flate2 = "1"
brotli = "9"
